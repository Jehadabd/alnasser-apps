# يبني الموقع وينشره على GitHub Pages عند كل دفع إلى main.
# الأمان: كل action مثبّت برقم commit (لا بوسم يمكن تحريكه)، وكل مهمة بأقل صلاحية تحتاجها،
# والبناء يرفض النشر إن لم تطابق بصمة أي ملف تنزيل ما هو منشور في الموقع.
name: نشر الموقع

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: تثبيت Pillow (لمعالجة الصور)
        run: python -m pip install --no-cache-dir -r tools/requirements.txt
      - name: بناء الموقع ومطابقة بصمات الملفات
        run: python tools/build.py --verify-assets
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
